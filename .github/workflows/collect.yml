name: Collect prices

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Price data lives on the "data" branch, kept as a single commit so the
      # repository does not grow with every snapshot.
      - name: Check out data branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin data; then
            git fetch --depth 1 origin data
            git worktree add --detach data-branch FETCH_HEAD
          else
            git worktree add --detach data-branch
            git -C data-branch rm -rfq .
          fi

      - name: Build forge recipes (daily)
        run: node scripts/build-recipes.mjs data-branch

      - name: Take price snapshot
        run: node scripts/collect.mjs data-branch

      - name: Publish data branch
        run: |
          cd data-branch
          git checkout -q --orphan snapshot
          git add -A
          git commit -q -m "Price snapshot $(date -u +%FT%TZ)"
          git push -f origin HEAD:refs/heads/data
